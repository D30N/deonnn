    <style>
      :root {
        --bg: #060a07;
        --term-bg: #0a0f0a;
        --term-edge: #1d2b1e;
        --green: #4ade80;
        --green-bright: #86efac;
        --green-dim: #3f6212;
        --amber: #fbbf24;
        --cyan: #22d3ee;
        --text: #c9d6c5;
        --text-dim: #7d8f78;
        --red: #f87171;
        --glow: 0 0 6px rgba(74, 222, 128, 0.35);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background:
          radial-gradient(1100px 600px at 50% -10%, rgba(74, 222, 128, 0.07), transparent 60%),
          var(--bg);
        color: var(--text);
        font-family: "JetBrains Mono", "Noto Sans Malayalam", ui-monospace, monospace;
        font-size: 15px;
        line-height: 1.55;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 22px 14px 18px;
        -webkit-font-smoothing: antialiased;
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
      }

      .preview-note {
        color: var(--text-dim);
        font-size: 12.5px;
        text-align: center;
        margin: 0 0 14px;
      }
      .preview-note strong { color: var(--amber); font-weight: 500; }

      /* ---------- terminal window ---------- */
      .terminal {
        width: 100%;
        max-width: 920px;
        flex: 1;
        display: flex;
        flex-direction: column;
        background: var(--term-bg);
        border: 1px solid var(--term-edge);
        border-radius: 12px;
        box-shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(0, 0, 0, 0.6), 0 0 44px -18px rgba(74, 222, 128, 0.25);
        overflow: hidden;
        min-height: 0;
      }
      .titlebar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 14px;
        background: #0e150e;
        border-bottom: 1px solid var(--term-edge);
        flex: none;
      }
      .dots { display: flex; gap: 8px; }
      .dot { width: 12px; height: 12px; border-radius: 50%; }
      .dot.r { background: #ff5f57; }
      .dot.y { background: #febc2e; }
      .dot.g { background: #28c840; }
      .titlebar .title {
        flex: 1;
        text-align: center;
        color: var(--text-dim);
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .titlebar .shell { color: var(--text-dim); font-size: 12px; }

      .screen {
        flex: 1;
        overflow-y: auto;
        padding: 18px 18px 8px;
        cursor: text;
        scrollbar-width: thin;
        scrollbar-color: var(--green-dim) transparent;
      }
      .screen::-webkit-scrollbar { width: 8px; }
      .screen::-webkit-scrollbar-thumb { background: var(--green-dim); border-radius: 4px; }

      .line { white-space: pre-wrap; word-break: break-word; margin: 0 0 2px; }
      .line.gap { margin-bottom: 12px; }
      .dim { color: var(--text-dim); }
      .grn { color: var(--green); text-shadow: var(--glow); }
      .bright { color: var(--green-bright); }
      .amb { color: var(--amber); }
      .cyn { color: var(--cyan); }
      .red { color: var(--red); }
      .b { font-weight: 700; }
      .ml { font-family: "Noto Sans Malayalam", "JetBrains Mono", sans-serif; }
      .screen a { color: var(--cyan); text-decoration: none; border-bottom: 1px dotted rgba(34, 211, 238, 0.5); }
      .screen a:hover { color: #a5f3fc; border-bottom-style: solid; }

      .banner {
        font-size: clamp(6.5px, 2.35vw, 12.5px);
        line-height: 1.25;
        color: var(--green);
        text-shadow: var(--glow);
        white-space: pre;
        margin: 2px 0 10px;
        overflow-x: hidden;
      }

      /* ---------- input line ---------- */
      .input-line {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 2px 0 14px;
      }
      .prompt { flex: none; white-space: nowrap; }
      .prompt .user { color: var(--green); font-weight: 700; text-shadow: var(--glow); }
      .prompt .path { color: var(--cyan); }
      .prompt .sym { color: var(--text); }
      #cmdInput {
        flex: 1;
        min-width: 40px;
        background: transparent;
        border: none;
        outline: none;
        color: var(--green-bright);
        font: inherit;
        font-size: 16px; /* keeps iOS from zooming on focus */
        caret-color: var(--green);
        padding: 0;
      }
      @media (min-width: 720px) { #cmdInput { font-size: 15px; } }
      #cmdInput::placeholder { color: #43543f; }

      /* ---------- quick commands ---------- */
      .quickbar {
        flex: none;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 12px 14px;
        border-top: 1px solid var(--term-edge);
        background: #0c120c;
        align-items: center;
      }
      .quickbar .hint { color: var(--text-dim); font-size: 12.5px; margin-right: 2px; }
      .qbtn {
        font: inherit;
        font-size: 13px;
        color: var(--green-bright);
        background: rgba(74, 222, 128, 0.07);
        border: 1px solid var(--green-dim);
        border-radius: 6px;
        padding: 5px 12px;
        cursor: pointer;
      }
      .qbtn:hover, .qbtn:active { background: rgba(74, 222, 128, 0.18); border-color: var(--green); }
      .qbtn::before { content: "$ "; color: var(--text-dim); }

      .foot {
        margin: 14px 0 0;
        color: var(--text-dim);
        font-size: 12.5px;
        text-align: center;
      }
      .foot .ml { font-family: "Noto Sans Malayalam", sans-serif; }
    </style>

        function articleLine(i, l) {
          var num = (i + 1 < 10 ? " " : "") + (i + 1);
          return '  <span class="dim">' + num + '.</span>  <a class="ml" href="' + l[1] + '" target="_blank" rel="noopener">' + l[0] + '</a>';
        }

        function cmdMemories() {
          print('<span class="bright b ml">Memories</span> <span class="dim">— 42 pieces from te.legra.ph/Memories-12-15</span>', "gap");
          MEMORIES.forEach(function (l, i) { print(articleLine(i, l)); });
          print("", "gap");
        }

        function cmdTelegram() {
          print('<span class="bright b">Posts about Telegram</span> <span class="dim">— 31 articles from te.legra.ph/Telegram-uyir-09-20</span>', "gap");
          TELEGRAM_POSTS.forEach(function (l, i) { print(articleLine(i, l)); });
          print("", "gap");
        }

        function cmdContact() {
          print('<span class="bright b">Say hello</span>');
          print('  → Telegram: <a href="https://t.me/Deonnn" target="_blank" rel="noopener">t.me/Deonnn</a>');
          print('  → WhatsApp: <a href="https://wa.me/919496063626?text=Hello%20Deon,%20What\'s%20up?%20" target="_blank" rel="noopener">wa.me/919496063626</a>');
          print('  → Email:    <a href="mailto:deepakdeon@yahoo.com">deepakdeon@yahoo.com</a>', "gap");
        }

        /* ---------------- engine ---------------- */

        var COMMANDS = {
          help: cmdHelp,
          about: cmdAbout,
          links: cmdLinks,
          socials: cmdLinks,
          memories: cmdMemories,
          telegram: cmdTelegram,
          contact: cmdContact,
          whoami: function () {
            print('<span class="bright b">Deepak Deon</span> <span class="dim">— Blogger • Tweep • Tech enthusiast</span>');
            print('Run <span class="grn">about</span> for more, or <span class="grn">links</span> for all my links.', "gap");
          },
          banner: function () { printBanner(); print(""); },
          date: function () { print(esc(new Date().toString()), "gap"); },
          ls: function () {
            print('<span class="cyn">about.txt</span>  <span class="cyn">links.txt</span>  <span class="cyn">contact.txt</span>');
            print('<span class="dim">Try running one — e.g.</span> <span class="grn">links</span>', "gap");
          },
          sudo: function () {
            print('<span class="red">visitor is not in the sudoers file.</span> <span class="dim">This incident will be reported to Deon.</span>', "gap");
          },
          clear: function () { output.innerHTML = ""; }
        };
        var NAMES = Object.keys(COMMANDS).concat(["echo", "exit"]);

        var history = [];
        var histIdx = -1;

        function run(raw) {
          var cmdline = raw.trim();
          print(PROMPT_HTML + " " + esc(cmdline));
          if (!cmdline) return;
          history.unshift(cmdline);
          histIdx = -1;

          var parts = cmdline.split(/\s+/);
          var name = parts[0].toLowerCase();
          var args = parts.slice(1).join(" ");

          if (name === "echo") {
            print(esc(args), "gap");
          } else if (name === "exit") {
            print('<span class="dim">There is no exit — you\'re on the web now. Try</span> <span class="grn">clear</span> <span class="dim">if you need a fresh screen.</span>', "gap");
          } else if (COMMANDS[name]) {
            COMMANDS[name]();
          } else {
            print('<span class="red">bash: ' + esc(name) + ': command not found</span> <span class="dim">— type</span> <span class="grn">help</span> <span class="dim">to see what\'s here.</span>', "gap");
          }
          scrollBottom();
        }

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          run(input.value);
          input.value = "";
        });

        input.addEventListener("keydown", function (e) {
          if (e.key === "ArrowUp") {
            e.preventDefault();
            if (histIdx < history.length - 1) { histIdx++; input.value = history[histIdx] || ""; }
          } else if (e.key === "ArrowDown") {
            e.preventDefault();
            if (histIdx > 0) { histIdx--; input.value = history[histIdx] || ""; }
            else { histIdx = -1; input.value = ""; }
          } else if (e.key === "Tab") {
            e.preventDefault();
            var v = input.value.trim().toLowerCase();
            if (v) {
              var match = NAMES.filter(function (n) { return n.indexOf(v) === 0; });
              if (match.length === 1) input.value = match[0];
              else if (match.length > 1) { print(PROMPT_HTML + " " + esc(input.value)); print(match.join("   "), "gap"); }
            }
          } else if (e.key === "l" && e.ctrlKey) {
            e.preventDefault();
            output.innerHTML = "";
          }
        });

        // Clicking anywhere in the screen focuses the input (but let links be links)
        screen.addEventListener("click", function (e) {
          if (e.target.closest("a")) return;
          input.focus();
        });

        // Quick command buttons
        document.querySelectorAll(".qbtn").forEach(function (b) {
          b.addEventListener("click", function () {
            input.value = "";
            run(b.getAttribute("data-cmd"));
            input.focus();
          });
        });

        /* ---------------- boot sequence ---------------- */
        function boot() {
          print('<span class="dim">Last login: ' + esc(new Date().toDateString()) + '</span>');
          printBanner();
          print('<span class="bright b">Deepak Deon</span>');
          print('Blogger • Tweep • Tech enthusiast');
          print('Telegram 💙 | AndroidCommunity 🤖');
          print("");
          print('Type <span class="grn b">help</span> to see what you can do, <span class="grn b">about</span> for my bio, or <span class="grn b">links</span> for all my links — or tap a command below.', "gap");
          input.focus();
        }
        if (reduceMotion) { boot(); }
        else {
          setTimeout(boot, 250);
          setTimeout(function () { input.focus(); }, 400);
        }
      })();
    </script>
